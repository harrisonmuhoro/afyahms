name: Deploy Production

on:
  push:
    tags: ['v*.*.*']

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://afya.local
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no deploy@prod.afya.local <<'EOF'
            cd /srv/afya-hms
            git fetch --tags
            git checkout ${{ github.ref_name }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm backend php artisan migrate --force
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend php artisan optimize
          EOF