name: Deploy Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.afya.local
    steps:
      - uses: actions/checkout@v4

      - name: Check staging SSH key
        id: staging_ssh_key
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          if [ -z "$STAGING_SSH_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "STAGING_SSH_KEY is not configured; skipping deployment."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.staging_ssh_key.outputs.has_key == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy
        if: steps.staging_ssh_key.outputs.has_key == 'true'
        run: |
          ssh -o StrictHostKeyChecking=no deploy@staging.afya.local <<'EOF'
            cd /srv/afya-hms
            git pull --rebase
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm backend php artisan migrate --force
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend php artisan optimize:clear
          EOF