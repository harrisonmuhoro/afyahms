# ============================================================
# Production overrides — copy to docker-compose.prod.yml and use:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
# Strip volume mounts, enable replicas, add healthchecks, secrets.
# ============================================================

services:
  backend:
    image: ${REGISTRY}/afya-hms-backend:${TAG:-latest}
    restart: always
    deploy:
      replicas: ${APP_REPLICAS:-2}
    volumes: []   # no source mounts in prod
    healthcheck:
      test: ["CMD", "php", "artisan", "app:health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  horizon:
    image: ${REGISTRY}/afya-hms-backend:${TAG:-latest}
    restart: always
    volumes: []
    deploy:
      replicas: ${HORIZON_REPLICAS:-1}

  scheduler:
    image: ${REGISTRY}/afya-hms-backend:${TAG:-latest}
    restart: always
    volumes: []

  reverb:
    image: ${REGISTRY}/afya-hms-backend:${TAG:-latest}
    restart: always
    volumes: []

  frontend:
    image: ${REGISTRY}/afya-hms-frontend:${TAG:-latest}
    restart: always
    volumes: []

  nginx:
    restart: always